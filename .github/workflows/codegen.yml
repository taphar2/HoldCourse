name: Regenerate Drift code

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate Drift code
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          (cd packages/holdcourse_domain && dart pub get)

      - name: Generate code
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Upload generated code
        uses: actions/upload-artifact@v4
        with:
          name: drift-generated
          path: lib/core/db/database.g.dart
          if-no-files-found: error
          retention-days: 7
